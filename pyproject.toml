[project]
name = "margin-optimizer"
version = "0.1.0"
description = "Headless B2B yield-management engine that recovers flight margin on active Pauschal bookings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hashtag World" }]

dependencies = [
    "strands-agents>=0.4",
    "strands-agents-tools>=0.4",
    "strands-traffics",
    "boto3>=1.34",
    "botocore>=1.34",
    "aws-lambda-powertools>=3.0",
    "aws-secretsmanager-caching>=1.1",
    "pydantic>=2.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "tenacity>=8.5",
    "slack-sdk>=3.31",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
report = [
    "jinja2>=3.1",
    "weasyprint>=62",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "moto[all]>=5.0",
    "faker>=26.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.32",
    "locust>=2.31",
    "pre-commit>=3.8",
    "alembic>=1.13",
]

[project.scripts]
mo-worker = "margin_optimizer.worker:main"
mo-ingest = "margin_optimizer.ingest:main"

[tool.uv.sources]
strands-traffics = { path = "./strands-traffics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["E501", "S101"]  # S101: assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["strands.*", "strands_tools.*", "strands_traffics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring AWS credentials",
    "saga: step-functions saga integration tests",
]
